<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">vite8-doctor social preview</title>
  <desc id="desc">Social preview image for vite8-doctor, a Vite 8 and Rolldown migration triage CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="54%" stop-color="#10151d"/>
      <stop offset="100%" stop-color="#17151e"/>
    </linearGradient>
    <radialGradient id="pulse-a" cx="20%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse-b" cx="86%" cy="82%" r="52%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#pulse-a)"/>
  <rect width="1280" height="640" fill="url(#pulse-b)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="760" y="118" width="378" height="404" rx="22" fill="#0c1118" stroke="#2b3442" stroke-width="2"/>
    <rect x="788" y="150" width="322" height="42" rx="10" fill="#141b25"/>
    <circle cx="816" cy="171" r="7" fill="#ef4444"/>
    <circle cx="840" cy="171" r="7" fill="#facc15"/>
    <circle cx="864" cy="171" r="7" fill="#22c55e"/>
    <text x="810" y="245" fill="#93c5fd" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24">$ npx vite8-doctor</text>
    <text x="810" y="301" fill="#f8fafc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22">status: review</text>
    <text x="810" y="345" fill="#f8fafc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22">probe: passed-with-risks</text>
    <text x="810" y="389" fill="#f8fafc" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22">hints: 4</text>
    <rect x="810" y="430" width="244" height="48" rx="12" fill="#182233" stroke="#334155"/>
    <text x="832" y="462" fill="#facc15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">agentAction[]</text>
  </g>

  <g>
    <rect x="122" y="132" width="86" height="86" rx="18" fill="#facc15"/>
    <path d="M166 153l-27 55h27l-7 33 35-55h-28l8-33z" fill="#10151d"/>
    <text x="122" y="292" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="82" font-weight="800">vite8-doctor</text>
    <text x="126" y="358" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="650">Vite 8 / Rolldown migration triage</text>
    <text x="126" y="410" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28">Reports for maintainers, CI scripts,</text>
    <text x="126" y="448" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28">and AI coding agents.</text>
    <g transform="translate(126 476)">
      <rect width="220" height="50" rx="14" fill="#1d2838" stroke="#3b82f6" stroke-opacity="0.6"/>
      <text x="24" y="33" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">json contract</text>
    </g>
    <g transform="translate(366 476)">
      <rect width="202" height="50" rx="14" fill="#1d2838" stroke="#facc15" stroke-opacity="0.6"/>
      <text x="24" y="33" fill="#fde68a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">build probes</text>
    </g>
  </g>
</svg>
